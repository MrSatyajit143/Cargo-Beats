<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CARGO BEATS - Premium Music Player for Truck Drivers">
    <meta name="theme-color" content="#06B6D4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CARGO BEATS">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23141e1e' width='192' height='192'/><circle cx='96' cy='96' r='60' fill='%2306b6d4'/><path d='M 80 70 L 80 120 Q 96 130 112 120 L 112 70 Z' fill='%23141e1e'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23141e1e' width='192' height='192'/><circle cx='96' cy='96' r='60' fill='%2306b6d4'/><path d='M 80 70 L 80 120 Q 96 130 112 120 L 112 70 Z' fill='%23141e1e'/></svg>">
    
    <title>CARGO BEATS - Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #14141e 0%, #1e1923 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,.03) 0px,
                    rgba(255,255,255,.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glow-1 {
            position: fixed;
            top: 25%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
        }

        .glow-2 {
            position: fixed;
            bottom: 25%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            font-size: 40px;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header h1 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #06b6d4, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            letter-spacing: 3px;
            color: #888;
            text-transform: uppercase;
        }

        .player {
            width: 100%;
            max-width: 450px;
            background: rgba(24, 24, 32, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            border: 2px solid rgba(6, 182, 212, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
            font-size: 80px;
        }

        .album-art.playing {
            animation: albumPulse 0.6s ease-in-out;
        }

        @keyframes albumPulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .visualizer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 0 20px;
        }

        .bar {
            width: 3px;
            height: 20px;
            background: linear-gradient(to top, #06b6d4, #a855f7);
            border-radius: 2px;
            opacity: 0.6;
        }

        .bar.active {
            animation: bounce 0.4s ease-in-out infinite;
            opacity: 1;
        }

        @keyframes bounce {
            0%, 100% { height: 20px; }
            50% { height: 40px; }
        }

        .track-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .track-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 14px;
            color: #06b6d4;
        }

        .progress-section {
            margin-bottom: 25px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(100, 100, 120, 0.3);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #a855f7);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            background: rgba(40, 40, 50, 0.8);
            color: #888;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .control-btn:hover {
            color: #06b6d4;
            border-color: rgba(6, 182, 212, 0.6);
            background: rgba(6, 182, 212, 0.1);
        }

        .control-btn.active {
            color: #06b6d4;
            border-color: rgba(6, 182, 212, 0.8);
            background: rgba(6, 182, 212, 0.2);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            color: #000;
            border: none;
            font-size: 24px;
            font-weight: bold;
            transform: scale(1);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
            border-radius: 50%;
            cursor: pointer;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(6, 182, 212, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .volume-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(6, 182, 212, 0.05);
            border-radius: 10px;
        }

        .volume-icon {
            font-size: 18px;
            color: #888;
        }

        .volume-slider {
            flex: 1; 
            height: 4px;
            border-radius: 2px;
            background: rgba(100, 100, 120, 0.3);
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
        }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
        }

        .volume-display {
            font-size: 12px;
            color: #888;
            width: 30px;
            text-align: right;
        }

        .playlist-section {
            border-top: 1px solid rgba(6, 182, 212, 0.2);
            padding-top: 20px;
        }

        .playlist-title {
            font-size: 11px;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 12px;
            background: rgba(40, 40, 50, 0.5);
            border: 1px solid rgba(100, 100, 120, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .playlist-item:hover {
            background: rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .playlist-item.active {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.6);
        }

        .playlist-indicator {
            display: flex;
            gap: 2px;
        }

        .playlist-indicator .dot {
            width: 2px;
            height: 12px;
            background: #06b6d4;
            border-radius: 1px;
            animation: bounce 0.4s ease-in-out infinite;
        }

        .playlist-indicator .dot:nth-child(2) {
            animation-delay: 0.1s;
        }

        .playlist-indicator .dot:nth-child(3) {
            animation-delay: 0.2s;
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-artist {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-time {
            font-size: 11px;
            color: #666;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }

        .playlist::-webkit-scrollbar-track {
            background: rgba(100, 100, 120, 0.1);
            border-radius: 3px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.4);
            border-radius: 3px;
        }

        .playlist::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.6);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
        }

        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
            display: none;
            z-index: 100;
            animation: slideUp 0.3s ease;
        }

        .install-btn.show {
            display: block;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(6, 182, 212, 0.6);
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading-indicator {
            display: none;
            text-align: center;
            color: #06b6d4;
            font-size: 12px;
            margin-top: 10px;
        }

        .loading-indicator.show {
            display: block;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 36px;
            }

            .player {
                padding: 20px;
                border-radius: 16px;
            }

            .install-btn {
                bottom: 80px;
                right: 15px;
                padding: 10px 16px;
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <div class="header">
            <div class="header-icon">🎵</div>
            <h1>CARGO BEATS</h1>
            <p>Premium Driving Experience</p>
        </div>

        <div class="player">
            <div class="album-art" id="albumArt">
                🎶
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="track-info">
                <div class="track-title" id="trackTitle">Loading...</div>
                <div class="track-artist" id="trackArtist">Demo Player</div>
            </div>

            <div class="progress-section">
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="shuffleBtn" title="Shuffle">🔀</button>
                <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
                <button class="play-btn" id="playBtn" title="Play">▶</button>
                <button class="control-btn" id="nextBtn" title="Next">⏭</button>
                <button class="control-btn" id="repeatBtn" title="Repeat">🔁</button>
            </div>

            <div class="volume-section">
                <div class="volume-icon">🔊</div>
                <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
                <div class="volume-display" id="volumeDisplay">70%</div>
            </div>

            <div class="loading-indicator" id="loadingIndicator">
                ⏳ Loading audio... Check browser console for errors
            </div>

            <div class="playlist-section">
                <div class="playlist-title">Queue</div>
                <div class="playlist" id="playlist"></div>
            </div>
        </div>

        <div class="footer">
            <p>TRUCK MUSIC PLAYER • AUDIO ENGINE V2.1 (WITH REAL AUDIO)</p>
        </div>
    </div>

    <button class="install-btn" id="installBtn">📥 Install App</button>

    <!-- AUDIO PLAYER ELEMENT -->
    <audio id="audioPlayer"></audio>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(err => console.log('SW registration failed:', err));
        }

        // Install Prompt
        let installPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            installPrompt = e;
            document.getElementById('installBtn').classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (installPrompt) {
                installPrompt.prompt();
                const { outcome } = await installPrompt.userChoice;
                console.log(`User response to install prompt: ${outcome}`);
                installPrompt = null;
                document.getElementById('installBtn').classList.remove('show');
            }
        });

        // ===== TRACKS WITH AUDIO URLS =====
        // UPDATE THESE URLs with your actual audio file paths
        const tracks = [
            { 
                title: 'Aigiri Nandini', 
                artist: 'Mr.Satyajit', 
                url: './Songs/aigiri_nandini.mp3' ,  // ← Add your MP3 file here
                duration: 100
            },
            { 
                title: 'Highway Dreams', 
                artist: 'Desert Waves', 
                url: '/songs/highway-dreams.mp3',  // ← Add your MP3 file here
                duration: 287 
            },
            { 
                title: 'Urban Pulse', 
                artist: 'City Lights', 
                url: '/songs/urban-pulse.mp3',  // ← Add your MP3 file here
                duration: 256 
            },
            { 
                title: 'Retro Vibes', 
                artist: 'Analog Soul', 
                url: '/songs/retro-vibes.mp3',  // ← Add your MP3 file here
                duration: 234 
            },
            { 
                title: 'Neon Nights', 
                artist: 'Synth Wave', 
                url: '/songs/neon-nights.mp3',  // ← Add your MP3 file here
                duration: 298 
            },
            { 
                title: 'Cargo Run', 
                artist: 'Trucker Tales', 
                url: '/songs/cargo-run.mp3',  // ← Add your MP3 file here
                duration: 265 
            }
        ];

        let currentTrack = 0;
        let isPlaying = false;
        let currentTime = 0;
        let shuffle = false;
        let repeat = 0;
        let volume = 70;

        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        const volumeDisplay = document.getElementById('volumeDisplay');
        const playlistEl = document.getElementById('playlist');
        const albumArt = document.getElementById('albumArt');
        const loadingIndicator = document.getElementById('loadingIndicator');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTrackInfo() {
            trackTitle.textContent = tracks[currentTrack].title;
            trackArtist.textContent = tracks[currentTrack].artist;
            
            // Load audio file
            audioPlayer.src = tracks[currentTrack].url;
            audioPlayer.volume = volume / 100;
            
            // Update duration once metadata is loaded
            audioPlayer.onloadedmetadata = () => {
                durationDisplay.textContent = formatTime(audioPlayer.duration);
            };
            
            audioPlayer.onerror = () => {
                console.error('Error loading audio:', tracks[currentTrack].url);
                loadingIndicator.classList.add('show');
            };
            
            updatePlaylist();
            albumArt.classList.add('playing');
            setTimeout(() => albumArt.classList.remove('playing'), 600);
        }

        function updateProgress() {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.style.width = progress + '%';
            currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
        }

        function updatePlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (idx === currentTrack ? ' active' : '');
                item.innerHTML = `
                    ${idx === currentTrack && isPlaying ? '<div class="playlist-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>' : ''}
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${track.title}</div>
                        <div class="playlist-item-artist">${track.artist}</div>
                    </div>
                    <div class="playlist-item-time">${formatTime(track.duration)}</div>
                `;
                item.addEventListener('click', () => {
                    currentTrack = idx;
                    updateTrackInfo();
                    playAudio();
                });
                playlistEl.appendChild(item);
            });
        }

        function playAudio() {
            audioPlayer.play();
            isPlaying = true;
            updatePlayerUI();
            loadingIndicator.classList.remove('show');
        }

        function pauseAudio() {
            audioPlayer.pause();
            isPlaying = false;
            updatePlayerUI();
        }

        function nextTrack() {
            if (shuffle) {
                currentTrack = Math.floor(Math.random() * tracks.length);
            } else {
                currentTrack = (currentTrack + 1) % tracks.length;
            }
            updateTrackInfo();
            if (isPlaying) playAudio();
        }

        function prevTrack() {
            if (audioPlayer.currentTime > 3) {
                audioPlayer.currentTime = 0;
            } else {
                currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
                updateTrackInfo();
            }
            updatePlaylist();
        }

        function updatePlayerUI() {
            if (isPlaying) {
                playBtn.textContent = '⏸';
                playBtn.title = 'Pause';
                albumArt.style.opacity = '1';
            } else {
                playBtn.textContent = '▶';
                playBtn.title = 'Play';
                albumArt.style.opacity = '0.7';
            }

            shuffleBtn.classList.toggle('active', shuffle);
            repeatBtn.classList.toggle('active', repeat > 0);
        }

        // Audio Event Listeners
        audioPlayer.addEventListener('timeupdate', updateProgress);
        
        audioPlayer.addEventListener('ended', () => {
            if (repeat === 2) {
                audioPlayer.currentTime = 0;
                playAudio();
            } else {
                nextTrack();
            }
        });

        // Button Event Listeners
        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseAudio();
            else playAudio();
        });

        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', () => nextTrack());

        shuffleBtn.addEventListener('click', () => {
            shuffle = !shuffle;
            updatePlayerUI();
        });

        repeatBtn.addEventListener('click', () => {
            repeat = (repeat + 1) % 3;
            updatePlayerUI();
        });

        volumeSlider.addEventListener('input', (e) => {
            volume = e.target.value;
            volumeDisplay.textContent = volume + '%';
            audioPlayer.volume = volume / 100;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        // Animate Visualizer
        setInterval(() => {
            if (isPlaying) {
                const bars = document.querySelectorAll('.bar');
                bars.forEach(bar => {
                    if (Math.random() > 0.5) {
                        bar.classList.add('active');
                    } else {
                        bar.classList.remove('active');
                    }
                });
            }
        }, 200);

        // Initialize
        updateTrackInfo();
        updatePlayerUI();
        updatePlaylist();
    </script>
</body>
</html>
